<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkymTA - Bejelentkezés</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; }
        body {
            background-color: #2e1a47;
            background-image: url('hatter.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        body::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.45); z-index: 1;
        }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; background-color: rgba(11, 15, 25, 0.85);
            border-bottom: 1px solid #1f293d; z-index: 2;
        }
        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-img { max-height: 36px; width: auto; display: block; }
        .logo-text { font-size: 1.25rem; font-weight: 700; color: #ffffff; }
        nav a { color: #d1d5db; text-decoration: none; font-size: 0.95rem; }
        nav a:hover { color: #10b981; }
        .ucp-container { flex: 1; display: flex; justify-content: center; align-items: center; z-index: 2; }
        .login-card {
            background-color: rgba(18, 22, 33, 0.92); border: 1px solid #2a344d;
            border-radius: 12px; padding: 24px 45px; width: 100%; max-width: 500px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); color: #ffffff; text-align: center;
        }
        .login-card h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
        .login-card p { font-size: 0.8rem; color: #9ca3af; margin-bottom: 18px; }
        .form-group { text-align: left; margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.75rem; color: #9ca3af; margin-bottom: 4px; text-transform: uppercase; }
        .form-control {
            width: 100%; padding: 10px 14px; background-color: #0b0f19;
            border: 1px solid #222d42; border-radius: 8px; color: #ffffff; font-size: 0.9rem; outline: none;
        }
        .form-control:focus { border-color: #10b981; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 0.85rem; color: #9ca3af; }
        .btn-login {
            width: 100%; background-color: #f3f4f6; color: #111827; padding: 11px;
            border: none; border-radius: 8px; font-weight: 700; font-size: 0.9rem;
            cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;
            text-decoration: none; transition: background-color 0.2s;
        }
        .btn-login:hover { background-color: #ffffff; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-container">
            <img src="Skymta.png" alt="SkymTA Logo" class="logo-img">
            <span class="logo-text">Skymta.hu</span>
        </a>
        <nav><a href="index.html">← Kezdőlap</a></nav>
    </header>

    <div class="ucp-container">
        <div class="login-card">
            <h2>Bejelentkezés</h2>
            <p>Add meg az adataid, melyekkel InGame regisztráltál.</p>
            
            <div class="form-group">
                <label>Felhasználónév</label>
                <!-- ID-t kapott, hogy le tudjuk olvasni a JavaScripttel -->
                <input type="text" id="usernameInput" class="form-control" placeholder="Pl. Elo2009">
            </div>

            <div class="form-group">
                <label>Jelszó</label>
                <input type="password" class="form-control" placeholder="******">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="remember">
                <label for="remember" style="margin-bottom:0; color: #9ca3af; cursor:pointer;">Emlékezz rám</label>
            </div>

            <!-- Gomb, ami elmenti a nevet és átvisz a profilra -->
            <button type="button" class="btn-login" onclick="loginUser()">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4m-5-5l5-5-5-5m5 5H3"></path></svg>
                Bejelentkezés
            </button>
        </div>
    </div>

    <script>
        function loginUser() {
            const username = document.getElementById('usernameInput').value.trim();
            if (username === "") {
                alert("Kérlek add meg a felhasználóneved!");
                return;
            }
            // Elmentjük a nevet a böngészőbe
            localStorage.setItem("skymta_user", username);
            // Átirányítunk a profil oldalra
            window.location.href = 'profil.html';
        }
    </script>
</body>
</html>
